name: desktop
# Builds CCGW Desktop for Windows; a desktop-v* tag also attaches the files to its release.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo test -q
      - run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Package
        shell: pwsh
        run: |
          $v = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName "out/CCGW-Desktop-windows-x64-setup.exe"
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/ccgw-rust-desktop.exe "portable/CCGW Desktop.exe"
          Compress-Archive -Path "portable/CCGW Desktop.exe" -DestinationPath "out/CCGW-Desktop-windows-x64-portable.zip" -Force
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ccgw-desktop-windows
          path: desktop/src-tauri/out/*
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} out/CCGW-Desktop-windows-x64-setup.exe out/CCGW-Desktop-windows-x64-portable.zip --clobber
